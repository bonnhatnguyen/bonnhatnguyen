  <text x="32" y="114" fill="url(#titleGrad)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="800" letter-spacing="1">BONNHATNGUYEN</text>
  <text x="32" y="140" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="500">Systems &amp; Web3 Infrastructure Architect · Rust, Solana &amp; Autonomous Agents</text>
  <text x="32" y="162" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-style="italic">Mechanical sympathy · Deterministic safety boundaries · Zero-overhead abstractions</text>

