<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="40%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#00FFA3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="90%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="10%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="276" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="276" rx="14" fill="url(#glowTopRight)"/>
  <rect x="2" y="2" width="876" height="276" rx="14" fill="url(#glowBottomLeft)"/>

  <!-- Top Window Header Bar -->
  <rect x="2" y="2" width="876" height="42" rx="14" fill="#161b22" fill-opacity="0.7"/>
  <line x1="2" y1="44" x2="878" y2="44" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="26" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="23" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="96" y="28" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">bonnhatnguyen@solana-apex: ~ (zsh)</text>

  <!-- Status Pill -->
  <g transform="translate(685, 12)">
    <rect width="168" height="22" rx="11" fill="#238636" fill-opacity="0.25" stroke="#2ea043" stroke-width="1"/>
