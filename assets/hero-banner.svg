    <text x="14" y="28" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">282M+ rows/s</text>
    <text x="14" y="47" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">1BRC AVX2 SIMD</text>
    <text x="14" y="63" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Rust · Branchless SWAR</text>
  </g>

