    <text x="14" y="28" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">Prod MCP Server</text>
    <text x="14" y="47" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">Solana Model Context</text>
    <text x="14" y="63" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Anthropic · Jupiter v6</text>
