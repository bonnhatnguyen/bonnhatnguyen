    <text x="14" y="47" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">Drainer &amp; Honeypot</text>
    <text x="14" y="63" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Batch Revoke · SPL-2022</text>
