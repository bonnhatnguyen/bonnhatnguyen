<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFA3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glowRight" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes dashMove {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes radarSweep {
        0% { transform: scale(0.6); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes ledBlink {
        0%, 100% { fill: #3fb950; opacity: 1; }
        50% { fill: #2ea043; opacity: 0.4; }
      }

      .circuit-line {
        stroke: #30363d;
        stroke-width: 1;
        fill: none;
      }
      .laser-packet {
        stroke: #00FFA3;
        stroke-width: 2;
        stroke-dasharray: 20 60;
        animation: dashMove 2.5s linear infinite;
        fill: none;
      }
      .laser-packet-blue {
        stroke: #58a6ff;
        stroke-width: 2;
        stroke-dasharray: 25 70;
        animation: dashMove 3s linear infinite reverse;
        fill: none;
      }
      .laser-packet-purple {
        stroke: #bc8cff;
        stroke-width: 2;
        stroke-dasharray: 15 50;
        animation: dashMove 2s linear infinite;
        fill: none;
      }
      .radar-wave {
        transform-origin: 800px 70px;
        animation: radarSweep 3s ease-out infinite;
      }
      .radar-wave-delay {
        transform-origin: 800px 70px;
        animation: radarSweep 3s ease-out infinite 1.5s;
      }
      .scanner-beam {
        animation: scanBeam 4s ease-in-out infinite;
      }
      .status-led {
        animation: ledBlink 1.8s infinite ease-in-out;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect x="1" y="1" width="878" height="288" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="288" rx="14" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="878" height="288" rx="14" fill="url(#glowLeft)"/>

  <!-- Background Isometric / Grid Accents -->
  <g opacity="0.18">
    <line x1="0" y1="50" x2="880" y2="50" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="0" y1="100" x2="880" y2="100" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="0" y1="150" x2="880" y2="150" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="0" y1="200" x2="880" y2="200" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="150" y1="0" x2="150" y2="290" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="350" y1="0" x2="350" y2="290" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="550" y1="0" x2="550" y2="290" stroke="#58a6ff" stroke-width="0.7"/>
    <line x1="750" y1="0" x2="750" y2="290" stroke="#58a6ff" stroke-width="0.7"/>
  </g>

  <!-- Animated Circuit Tracks -->
  <path d="M 30 180 L 160 180 L 190 210 L 850 210" class="circuit-line"/>
  <path d="M 30 180 L 160 180 L 190 210 L 850 210" class="laser-packet"/>

  <path d="M 500 50 L 680 50 L 720 90 L 850 90" class="circuit-line"/>
  <path d="M 500 50 L 680 50 L 720 90 L 850 90" class="laser-packet-blue"/>

  <path d="M 220 280 L 220 240 L 400 240 L 450 190 L 850 190" class="circuit-line"/>
  <path d="M 220 280 L 220 240 L 400 240 L 450 190 L 850 190" class="laser-packet-purple"/>

  <!-- Scanning Beam Effect -->
  <rect x="0" y="40" width="880" height="2" fill="url(#laserGrad)" class="scanner-beam"/>

  <!-- Radar Beacon (Top Right) -->
  <circle cx="800" cy="65" r="30" stroke="#00FFA3" stroke-width="1.5" fill="none" class="radar-wave"/>
  <circle cx="800" cy="65" r="30" stroke="#58a6ff" stroke-width="1.5" fill="none" class="radar-wave-delay"/>
  <circle cx="800" cy="65" r="4" fill="#00FFA3"/>

  <!-- Top Window Header Bar -->
  <rect x="1" y="1" width="878" height="40" rx="14" fill="#161b22" fill-opacity="0.8"/>
  <line x1="1" y1="41" x2="879" y2="41" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="21" r="5.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="86" y="26" fill="#8b949e" class="font-mono" font-size="12.5" font-weight="500">bonnhatnguyen@solana-apex: ~ (kernel-v2)</text>

  <!-- Live Status Beacon -->
  <g transform="translate(640, 10)">
    <rect width="215" height="22" rx="11" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" class="status-led"/>
    <text x="26" y="15" fill="#58a6ff" class="font-mono" font-size="10" font-weight="700" letter-spacing="0.5">ONLINE // SOLANA &amp; SIMD ARCH</text>
  </g>

  <!-- Main Identity & Typography -->
  <text x="32" y="74" fill="#58a6ff" class="font-mono" font-size="13.5" font-weight="600">$ whoami --tier=principal</text>
  <text x="32" y="112" fill="url(#cyanPurple)" class="font-mono" font-size="34" font-weight="800" letter-spacing="1.5">BONNHATNGUYEN</text>
  <text x="32" y="138" fill="#e6edf3" class="font-mono" font-size="14.5" font-weight="500">Systems &amp; Web3 Infrastructure Architect · Rust, Solana &amp; Autonomous AI Agents</text>
  <text x="32" y="160" fill="#8b949e" class="font-mono" font-size="12" font-style="italic">Mechanical sympathy · Deterministic safety boundaries · Zero-overhead abstractions</text>

  <!-- 4 HUD Telemetry Cards (Bottom) -->
  <!-- Card 1: 1BRC AVX2 -->
  <g transform="translate(30, 186)">
    <rect width="195" height="78" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="195" height="3" rx="1.5" fill="#3fb950"/>
    <text x="14" y="28" fill="#3fb950" class="font-mono" font-size="17" font-weight="700">282M+ rows/s</text>
    <text x="14" y="48" fill="#e6edf3" class="font-mono" font-size="12" font-weight="600">1BRC AVX2 Engine</text>
    <text x="14" y="65" fill="#8b949e" class="font-mono" font-size="10.5">Rust · Branchless SWAR</text>
  </g>

  <!-- Card 2: Jito MEV -->
  <g transform="translate(240, 186)">
    <rect width="195" height="78" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="195" height="3" rx="1.5" fill="#58a6ff"/>
    <text x="14" y="28" fill="#58a6ff" class="font-mono" font-size="17" font-weight="700">&lt; 100ms MEV</text>
    <text x="14" y="48" fill="#e6edf3" class="font-mono" font-size="12" font-weight="600">Jito Bundle Router</text>
    <text x="14" y="65" fill="#8b949e" class="font-mono" font-size="10.5">>98% Tip Landing Floor</text>
  </g>

  <!-- Card 3: Model Context Protocol -->
  <g transform="translate(450, 186)">
    <rect width="195" height="78" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="195" height="3" rx="1.5" fill="#bc8cff"/>
    <text x="14" y="28" fill="#bc8cff" class="font-mono" font-size="17" font-weight="700">Prod MCP Server</text>
    <text x="14" y="48" fill="#e6edf3" class="font-mono" font-size="12" font-weight="600">Solana Model Context</text>
    <text x="14" y="65" fill="#8b949e" class="font-mono" font-size="10.5">Anthropic · Jupiter v6</text>
  </g>

  <!-- Card 4: Security Sentinel -->
  <g transform="translate(660, 186)">
    <rect width="190" height="78" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="190" height="3" rx="1.5" fill="#f0883e"/>
    <text x="14" y="28" fill="#f0883e" class="font-mono" font-size="17" font-weight="700">0–100 SecScore</text>
    <text x="14" y="48" fill="#e6edf3" class="font-mono" font-size="12" font-weight="600">Sentinel Drain Guard</text>
    <text x="14" y="65" fill="#8b949e" class="font-mono" font-size="10.5">Token-2022 · Honeypot</text>
  </g>
</svg>
